<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple personal timeline for events, deadlines, and tasks.">
    <title>Timeline</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main>
      <header class="toolbar">
        <h1>Timeline</h1>
        <div class="controls">
          <button id="today" type="button">Today</button>
          <label for="zoom">Scale</label>
          <select id="zoom">
            <option value="32">Days</option>
            <option value="12" selected>Weeks</option>
            <option value="3">Months</option>
          </select>
          <button id="add" type="button" class="primary">Add entry</button>
        </div>
      </header>
      <p class="hint">Scroll horizontally to move through time. Select an entry to edit it.</p>
      <p id="message" role="status" hidden></p>
      <section aria-label="Personal timeline">
        <div class="timeline-heading">
          <p id="visible-range"></p>
          <span id="entry-count"></span>
        </div>
        <div id="timeline" tabindex="0" role="region" aria-label="Scrollable timeline">
          <div id="canvas">
            <div id="ruler" aria-hidden="true"></div>
            <div id="entries"></div>
            <div id="today-line" aria-hidden="true"><span>Today</span></div>
          </div>
        </div>
        <div id="empty" hidden>
          <p>Your timeline is empty.</p>
          <button id="empty-add" type="button">Add your first entry</button>
        </div>
      </section>
      <footer>Saved in this browser only.</footer>
    </main>

    <dialog id="editor" aria-labelledby="editor-heading">
      <form id="entry-form">
        <h2 id="editor-heading">Add entry</h2>
        <label for="title">Title</label>
        <input id="title" name="title" required maxlength="160" autocomplete="off">
        <label for="kind">Type</label>
        <select id="kind" name="kind">
          <option value="event">Event</option>
          <option value="deadline">Deadline</option>
          <option value="task">Task</option>
        </select>
        <div class="date-fields">
          <div>
            <label for="start">Date / start</label>
            <input id="start" name="start" type="date" required min="0001-01-01" max="9999-12-31">
          </div>
          <div>
            <label for="end">End date <span class="optional">(optional)</span></label>
            <input id="end" name="end" type="date" min="0001-01-01" max="9999-12-31">
          </div>
        </div>
        <label id="completed-label" class="checkbox" hidden>
          <input id="completed" name="completed" type="checkbox"> Task complete
        </label>
        <p id="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="delete" type="button" class="danger" hidden>Delete</button>
          <div>
            <button id="cancel" type="button">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </div>
      </form>
    </dialog>
    <noscript>This app needs JavaScript to display and save your timeline.</noscript>
  </body>
</html>
